name: PassableIos
options:
  bundleIdPrefix: com.nikolausmarek
  deploymentTarget:
    iOS: "17.0"
settings:
  MARKETING_VERSION: "1.0"
  CURRENT_PROJECT_VERSION: "1"
  DEVELOPMENT_TEAM: C5MSK2XBMK
targets:
  PassableIos:
    type: application
    platform: iOS
    sources:
      - PassableIos
      # The .passablemix format: the Mac app's own file, so the two can't drift.
      - path: ../Passable/Model/PassableMix.swift
        group: Shared
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.nikolausmarek.PassableIos
      PRODUCT_NAME: PassableIos
      SWIFT_VERSION: "5.0"
      TARGETED_DEVICE_FAMILY: "1"
      GENERATE_INFOPLIST_FILE: YES
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      ENABLE_PREVIEWS: YES
    info:
      path: PassableIos/App/Info.plist
      properties:
        CFBundleDisplayName: Passable
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [audio]
        UIUserInterfaceStyle: Dark
        LSSupportsOpeningDocumentsInPlace: false
        NSLocalNetworkUsageDescription: Passable receives sets from Passable on your Mac over your Wi-Fi.
        NSBonjourServices: [_passablemix._tcp, _passablemix._udp]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Passable Mix
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [com.nikolausmarek.passable.mix]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.nikolausmarek.passable.mix
            UTTypeDescription: Passable Mix
            UTTypeConformsTo: [public.data, public.content]
            UTTypeTagSpecification:
              public.filename-extension: [passablemix]
              public.mime-type: [application/x-passablemix]
  PassableIosTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - PassableIosTests
    dependencies:
      - target: PassableIos
    settings:
      SWIFT_VERSION: "5.0"
      GENERATE_INFOPLIST_FILE: YES
schemes:
  PassableIos:
    build:
      targets:
        PassableIos: all
        PassableIosTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PassableIosTests
