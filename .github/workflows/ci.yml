name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (macOS)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      # The Core ML models are made locally (tools/convert-*/convert.py) and
      # aren't checked in; the app loads them at run time. A project
      # generated here from project.yml leaves them out (and shows that the
      # spec still builds).
      - name: Generate the project
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          brew install xcodegen
          xcodegen generate
      # (bash with pipefail: the step fails when xcodebuild does, not only
      # when tail does.)
      # The newest Xcode the runner has (the app is written against the
      # latest SDK), and the compiler's own errors if the build fails.
      - name: Build the app and its tests
        shell: bash
        run: |
          ls -d /Applications/Xcode*.app
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version
          xcodebuild build-for-testing -project Passable.xcodeproj -scheme Passable \
            -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO > build.log 2>&1 \
            || { grep -E "error:" build.log | sort -u | head -40; tail -20 build.log; exit 1; }
          tail -5 build.log

  ios:
    name: Build and test (iPhone)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Generate the project
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          brew install xcodegen
          cd ios && xcodegen generate
      # On whichever iPhone simulator the runner has.
      - name: Test on a simulator
        shell: bash
        run: |
          device=$(xcrun simctl list devices available -j | python3 -c "import json,sys; print(next(d['udid'] for r,ds in json.load(sys.stdin)['devices'].items() if 'iOS' in r for d in ds if d['name'].startswith('iPhone')))")
          cd ios
          xcodebuild test -project PassableIos.xcodeproj -scheme PassableIos \
            -destination "platform=iOS Simulator,id=$device" CODE_SIGNING_ALLOWED=NO | tail -40
